const speedSlider=document.querySelector('#speed');speedSlider.addEventListener('input',()=>{speed=+speedSlider.value;document.querySelector('#speedText').textContent=speed.toFixed(1)+'×';});
document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止';});
document.querySelector('#reset').addEventListener('click',()=>{tyaw=.57;tpitch=.26;tdist=10.5;tpanX=0;tpanY=0;});
const points=new Map();let pinch=null, lastMid=null;
canvas.addEventListener('pointerdown',e=>{points.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);pinch=null;lastMid=null;});
canvas.addEventListener('pointermove',e=>{
 if(!points.has(e.pointerId))return;
 const old=points.get(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);
 if(points.size===1){tyaw+=(e.clientX-old[0])*.008;tpitch=Math.min(1.4,Math.max(-1.4,tpitch+(e.clientY-old[1])*.008));}
 else if(points.size===2){
  const [a,b]=Array.from(points.values()),d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  if(pinch!==null&&d>1)tdist=Math.max(5.5,Math.min(23,tdist*pinch/d));
  if(lastMid){const pixelsToWorld=2*tdist*Math.tan(Math.PI/6.8)/Math.max(1,canvas.clientHeight);tpanX+=(mid[0]-lastMid[0])*pixelsToWorld;tpanY-=(mid[1]-lastMid[1])*pixelsToWorld;}
  pinch=d;lastMid=mid;
 }
});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{points.delete(e.pointerId);pinch=null;lastMid=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();tdist=Math.max(5.5,Math.min(23,tdist*Math.exp(e.deltaY*.001)));},{passive:false});
gl.enable(gl.DEPTH_TEST);gl.clearColor(.961,.969,.981,1);
function frame(ms){requestAnimationFrame(frame);const dt=Math.min(.04,(ms-previous||16)/1000);previous=ms;if(!paused)t+=dt*speed;
const a=1-Math.exp(-dt*10);yaw+=(tyaw-yaw)*a;pitch+=(tpitch-pitch)*a;dist+=(tdist-dist)*a;panX+=(tpanX-panX)*a;panY+=(tpanY-panY)*a;
const dpr=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
let extra=motion==='still'?mult(rotateX(0),rotateY(0)):motion==='spin'?mult(rotateY(t*.32),mult(rotateZ(t*.13),rotateX(t*.17))):mult(rotateY(Math.sin(t*.21)*.24),rotateX(Math.cos(t*.19)*.1));
const world=mult(rotateY(yaw),mult(rotateX(pitch),extra));
const eye=[0,0,dist],cam=mult(persp(Math.PI/3.4,w/h,.1,70),mult(view(eye),translate(panX,panY,0)));gl.uniformMatrix4fv(loc.mvp,false,mult(cam,world));gl.uniformMatrix4fv(loc.world,false,world);gl.uniform3fv(loc.eye,new Float32Array(eye));gl.uniform1f(loc.time,t);gl.uniform1f(loc.gradient,colorMode==='gradient'?1:0);gl.uniform1f(loc.localMotion,motion==='local'||motion==='gentle'?1.0:0.0);
for(const mesh of meshes){gl.uniform3fv(loc.base,new Float32Array(mesh.color));gl.bindBuffer(gl.ARRAY_BUFFER,mesh.vb);gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(loc.nor,3,gl.FLOAT,false,24,12);gl.enableVertexAttribArray(loc.pos);gl.enableVertexAttribArray(loc.nor);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.ib);gl.drawElements(gl.TRIANGLES,mesh.nf*3,mesh.indexType,0);}
}
document.querySelector('[data-color=original]').classList.remove('active');document.querySelector('[data-color=gradient]').classList.add('active');document.querySelector('[data-motion=gentle]').classList.remove('active');document.querySelector('[data-motion=local]').classList.add('active');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){paused=true;document.querySelector('#pause').textContent='再生';}
requestAnimationFrame(frame);
})();
</script></body></html>
